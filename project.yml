name: Mnemonics
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  MnemonicsCore:
    path: MnemonicsCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  Mnemonics:
    type: application
    platform: iOS
    sources:
      - Mnemonics
    dependencies:
      - package: MnemonicsCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    entitlements:
      path: Mnemonics/Mnemonics.entitlements
    settings:
      base:
        # Same bundle id as the Flutter app so the existing Firebase project / GoogleService-Info.plist work.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mnemonics
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Optional: AI features (Tree Spirit / mnemonic generator). Set in Xcode build settings or an xcconfig.
        OPENROUTER_API_KEY: ""
    info:
      path: Mnemonics/Info.plist
      properties:
        CFBundleDisplayName: Mnemonics
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [fetch, remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        OPENROUTER_API_KEY: $(OPENROUTER_API_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.44193555309-tq60ft4dkkr9bur82986026l5bpjdncl
  MnemonicsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MnemonicsCore/Tests]
    dependencies:
      - package: MnemonicsCore
